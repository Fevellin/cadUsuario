<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Cliente</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-white text-dark">

    <!-- Container principal -->
    <div class="container d-flex justify-content-center align-items-center min-vh-100 form-container">

        <!-- Formulário centralizado -->
        <div class="mx-auto card">

            <!-- Cabeçalho-->
            <h1 class="text-center text-white bg-dark fs-6 fw-normal p-2 mb-0">Cadastro de Cliente</h1>
            
            <form id="registrationForm" class="p-3" novalidate>

                <!-- Nome e sobrenome -->
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <label for="nome" class="form-label small mb-1">Nome</label>
                        <input type="text" class="form-control form-control-sm" id="nome" name="nome" 
                               required>
                        
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-6">
                        <label for="sobrenome" class="form-label small mb-1">Sobrenome</label>
                        <input type="text" class="form-control form-control-sm" id="sobrenome" name="sobrenome" 
                               required>
                        
                        <div class="invalid-feedback"></div>   
                    </div>
                </div>

                <!-- E-mail e senha -->
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <label for="email" class="form-label small mb-1">Email</label>
                        <input type="email" class="form-control form-control-sm" id="email" name="email" 
                               placeholder="exemplo@email.com" required>
                        
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-6">
                        <label for="senha" class="form-label small mb-1">Senha</label>
                        <input type="password" class="form-control form-control-sm" id="senha" name="senha" 
                               required>
                        
                        <div class="invalid-feedback"></div>
                    </div>
                </div>

                <!-- Endereço -->
                <h2 class="fs-6 fw-bold mt-2 mb-2">Endereço</h2>
                
                <!-- CEP, rua e bairro -->
                <div class="row g-2 mb-2">
                    <div class="col-3">
                        <label for="cep" class="form-label small mb-1">CEP</label>
                        <input type="text" class="form-control form-control-sm" id="cep" name="cep" maxlength="8" 
                               placeholder="Apenas números" inputmode="numeric" required>
                        
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-5">
                        <label for="logradouro" class="form-label small mb-1">Rua</label>
                        <input type="text" class="form-control form-control-sm" id="logradouro" name="logradouro" 
                               readonly required>
                        
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-4">
                        <label for="bairro" class="form-label small mb-1"> Bairro</label>
                        <input type="text" class="form-control form-control-sm" id="bairro" name="bairro" 
                               readonly required>
                        
                        <div class="invalid-feedback"></div>
                    </div>
                </div>

                <!-- Cidade, estado, número e complemento -->
                <div class="row g-2 mb-3">
                    <div class="col-4">
                        <label for="cidade" class="form-label small mb-1">Cidade</label>
                        <input type="text" class="form-control form-control-sm" id="cidade" name="cidade" 
                               readonly required>
                        
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-2">
                        <label for="estado" class="form-label small mb-1">Estado</label>
                        <input type="text" class="form-control form-control-sm" id="estado" name="estado" 
                               readonly required>
                        
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-2">
                        <label for="numero" class="form-label small mb-1">Número</label>
                        <input type="text" class="form-control form-control-sm" id="numero" name="numero" 
                               placeholder="Ex.: 123" inputmode="numeric" required>
                        
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-4">
                        <label for="complemento" class="form-label small mb-1">Complemento</label>
                        <input type="text" class="form-control form-control-sm" id="complemento" name="complemento">
                    </div>
                </div>

                <!-- Botão Cadastrar-->
                <button type="submit" class="btn btn-dark btn-sm">
                    Cadastrar
                </button>
            </form>
        </div>
    </div>

<!-- Modal de sucesso -->    
<div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="sucessModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="sucessModalLabel">Sucesso</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                Cadastro realizado com sucesso!
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-dark btn-sm" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Scripts do projeto -->
    <script src="main.js"></script>
    <script src="validation.js"></script>

</body>
</html>
